## Attending students: project (33% of the final score)

<div class="content-center">

The project:

- involves the study of **one** real-world vulnerability

- is submitted as **one** 15 pages PDF report:
    - description of the affected program
    - description of the vulnerability type
    - description of the vulnerability
    - exploitation of the vulnerability
    - mitigation of the vulnerability
    - [optional, only for higher score] reproduction and fix of the vulnerability in a docker environment
    
- is evaluated based on a 0-30 points scale:
    - 26 points for the report
    - 4 points for reproduction environment (optional)



</div>

---

## Non-attending students: project (50% of the final score)

<div class="content-center">

The project:

- involves the study of **two** real-world vulnerabilities

- is submitted as **two** 15 pages PDF reports (30 pages total):
    - description of the affected program
    - description of the vulnerability type
    - description of the vulnerability
    - exploitation of the vulnerability
    - mitigation of the vulnerability
    - reproduction and fix of the vulnerability in a docker environment

- is evaluated based on 0-30 points scale:
    - 20 points for the reports
    - 10 points for reproduction environment

- **Reproduction environment is required!**



</div>

## CVE Assignment

<div class="content-center">

- Each student should pick one (or two when non compliant) CVEs
    - Google query: **CVE *program that you want to consider***
    - E.g., "Wordpress CVE", "Flask CVE", "n8n CVE", ...
    - You consider even vulnerability types that have not been covered in the course
    - Understand whether there is enough material to analyze:
      - Source code (if the application is open source)
      - Vulnerability description
      - Exploit code
      - etc.

<br/>


- Check which CVEs has been already proposed by other students and thus cannot be considered by you: [**URL**](https://docs.google.com/spreadsheets/d/e/2PACX-1vQsj4A24-as0FElrgChs5g38Hr9DBJ0-AT2rG90IIO5Dj0QvD0NfofhrgeqzcWY1Y2qS8qS4z-pkbEE/pubhtml?gid=79397352&single=true)
- Submit your proposal via the form: [**FORM**](https://forms.gle/NDgeDC8xnxabHFjS9)
